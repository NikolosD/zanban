appId: com.zanban.app
productName: Zanban
directories:
  buildResources: resources
  output: release/${version}
# better-sqlite3 ships Node-API prebuilds that load in any Electron, and its
# binding.gyp would otherwise make the rebuild step demand a C++ toolchain.
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # grantFileProtocolExtraPrivileges stays on: packaged renderer pages and the
  # audio worklet load over file://.
files:
  - out/**
  - resources/**
  - '!**/*.{ts,tsx,map}'
  - '!**/node_modules/**/*.md'
  # Models download to userData/models at runtime (services/transformers.ts);
  # .cache is a stale dev download and dist/ is the browser bundle + ort wasm.
  - '!**/node_modules/@xenova/transformers/{.cache,dist}/**'
  # Under Node, transformers runs on onnxruntime-node; onnxruntime-web is only
  # imported for its ort-web.node.js entry.
  - '!**/node_modules/onnxruntime-web/{docs,lib}/**'
  - '!**/node_modules/onnxruntime-web/dist/!(ort-web.node.js)'
  # onnxruntime-node loads bin/napi-v3/<platform>/<arch>; drop every other build.
  - '!**/node_modules/onnxruntime-node/bin/napi-v3/!(${platform})/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v3/${platform}/!(${arch})/**'
  # Under Node, tesseract.js requires a core .js that reads its sibling .wasm;
  # the .wasm.js copies inline the binary for browsers. Keep every .js/.wasm
  # pair: tesseract.js 7 ignores OEM 1 and picks a non-LSTM core in Node.
  - '!**/node_modules/tesseract.js-core/*.wasm.js'
  # better-sqlite3 loads prebuilds/<platform>-<arch>.node; deps/ and src/ are C sources.
  - '!**/node_modules/better-sqlite3/{deps,src}/**'
  - '!**/node_modules/better-sqlite3/binding.gyp'
  - '!**/node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}.node)'
  # dist/ is a byte-identical copy of the package root build.
  - '!**/node_modules/@elevenlabs/elevenlabs-js/{dist,assets,scripts}/**'
asarUnpack:
  - resources/**
  # sqlite-vec ships native shared libraries (.dll/.dylib/.so) that
  # better-sqlite3.loadExtension() must read from a real path on disk, not
  # from inside the asar archive. Unpack every platform variant we ship.
  - node_modules/sqlite-vec/**
  - node_modules/sqlite-vec-windows-x64/**
  - node_modules/sqlite-vec-darwin-x64/**
  - node_modules/sqlite-vec-darwin-arm64/**
  - node_modules/sqlite-vec-linux-x64/**
  - node_modules/sqlite-vec-linux-arm64/**
  # better-sqlite3 native binding
  - node_modules/better-sqlite3/**
  # sherpa-onnx's addon loads onnxruntime and its C API DLLs from its own folder.
  - node_modules/sherpa-onnx-{win,darwin,linux}-*/**
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Zanban
  uninstallDisplayName: Zanban
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
publish:
  - provider: github
    owner: NikolosD
    repo: zanban
