name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

# A second push to the same branch / PR cancels any prior run — keeps the
# Actions queue moving and avoids paying for stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build (${{ matrix.os }})
    # Windows is the primary target; Linux keeps the build honest elsewhere.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The postinstall hook runs electron-rebuild + a sqlite-vec sanity
      # check that need native deps. Skipping the rebuild on CI keeps the
      # install fast — we never run the binary, only typecheck/test/build.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Warning ratchet: lower the number as warnings get fixed, never raise it.
      - run: pnpm lint --max-warnings 14

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
