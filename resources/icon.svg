<?xml version="1.0" encoding="UTF-8"?>
<!--
  Zanban app icon. Mirrors the in-app phase-dot mark (see ZanbanMark.tsx
  → MarkPhaseDot variant) on a sage-tinted dark gradient with a pill-radius
  rounded square — macOS / Windows app-icon convention.

  Source of truth: this SVG. PNG/ICNS variants are generated by
  scripts/generate-icons.cjs. Re-run it after editing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2120"/>
      <stop offset="100%" stop-color="#0d1413"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#9bd4ad" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9bd4ad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square plate. 184 px corner radius matches macOS Big Sur+
       icon corner ratio (~18%). -->
  <rect x="0" y="0" width="1024" height="1024" rx="184" ry="184" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="184" ry="184" fill="url(#glow)"/>

  <!-- Mark — half-disk + signal dot, scaled to ~58% of the icon. The
       coordinates mirror the MarkPhaseDot maths (c=512, r=size*0.36 of a
       conceptual 1024 mark). -->
  <g>
    <!-- half-disk, foreground -->
    <path
      d="M 512 144 A 368 368 0 0 0 512 880 Z"
      fill="#e8efe9"
      opacity="0.92"/>
    <!-- signal dot -->
    <circle cx="714" cy="512" r="76" fill="#9bd4ad"/>
  </g>
</svg>
